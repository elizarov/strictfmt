name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev+g${GITHUB_SHA:0:12}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Linux tests (x86_64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRICTFMT_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify runner architecture
        run: test "$(uname -m)" = x86_64

      - name: Build and test
        run: scripts/test.sh

  build:
    name: Build ${{ matrix.platform }}
    needs:
      - version
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: windows-latest
            platform: windows-x86_64
          - runner: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      STRICTFMT_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify Unix runner architecture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          expected=x86_64
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            expected=arm64
          fi
          test "$(uname -m)" = "$expected"

      - name: Verify Windows runner architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Expected AMD64, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/build.sh

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio with the x64 C++ tools was not found"
          }
          Import-Module "$installPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installPath -DevCmdArguments "-arch=x64 -host_arch=x64"
          & .\scripts\build.cmd
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify and package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test "$(build/strictfmt --version)" = "strictfmt $STRICTFMT_VERSION"
          mkdir -p dist/package
          cp build/strictfmt dist/package/strictfmt
          tar -C dist/package -czf "dist/strictfmt-$STRICTFMT_VERSION-${{ matrix.platform }}.tar.gz" strictfmt

      - name: Verify and package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = & .\build\strictfmt.exe --version
          if ($actual -ne "strictfmt $env:STRICTFMT_VERSION") {
            throw "Unexpected version: $actual"
          }
          New-Item -ItemType Directory -Force dist\package | Out-Null
          Copy-Item build\strictfmt.exe dist\package\strictfmt.exe
          Compress-Archive -Path dist\package\strictfmt.exe -DestinationPath "dist\strictfmt-$env:STRICTFMT_VERSION-${{ matrix.platform }}.zip"

      - name: Upload packaged executable
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/strictfmt-*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum strictfmt-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "strictfmt ${{ needs.version.outputs.value }}" \
              --generate-notes
          fi
